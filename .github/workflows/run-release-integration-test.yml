name: Release Integration Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-test:
    runs-on: ubuntu-latest
    name: OTP ${{matrix.otp}} / Elixir ${{matrix.elixir}}
    strategy:
      matrix:
        include:
          - otp: '27.3.4.2'
            elixir: '1.17.3'
    defaults:
      run:
        working-directory: examples/release_demo
    env:
      MIX_ENV: prod
    steps:
      - uses: actions/checkout@main
      - uses: erlef/setup-beam@main
        with:
          otp-version: ${{matrix.otp}}
          elixir-version: ${{matrix.elixir}}

      - name: Install dependencies
        run: mix deps.get

      - name: Build release (AC-1)
        run: mix release

      - name: Start release (AC-2)
        run: |
          _build/prod/rel/release_demo/bin/release_demo daemon
          # Wait for the release to start and accept connections
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3333/ping 2>/dev/null; then
              echo "Release is up after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run smoke tests (AC-3 through AC-6)
        run: |
          chmod +x smoke_test.sh
          ./smoke_test.sh

      - name: Stop release (AC-7)
        if: always()
        run: |
          _build/prod/rel/release_demo/bin/release_demo stop || true
